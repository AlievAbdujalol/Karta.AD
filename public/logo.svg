<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>

  <!-- Pin ring -->
  <path d="M100 18 C60 18 28 50 28 90 C28 120 48 145 72 162 L100 182 L128 162 C152 145 172 120 172 90 C172 50 140 18 100 18 Z"
    fill="url(#pinGrad)" opacity="0.15"/>
  <path d="M100 18 C60 18 28 50 28 90 C28 120 48 145 72 162 L100 182 L128 162 C152 145 172 120 172 90 C172 50 140 18 100 18 Z"
    fill="none" stroke="url(#pinGrad)" stroke-width="12"/>

  <!-- Road -->
  <path d="M100 175 Q88 148 76 128 Q64 108 68 95" stroke="#0D47A1" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Road dashes -->
  <path d="M95 158 Q90 148 86 138" stroke="white" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" fill="none"/>

  <!-- Bus body -->
  <rect x="68" y="52" width="64" height="46" rx="8" fill="#0D47A1"/>
  <!-- Bus windshield -->
  <rect x="74" y="57" width="52" height="22" rx="4" fill="white" opacity="0.95"/>
  <!-- Bus front detail -->
  <rect x="74" y="83" width="14" height="10" rx="3" fill="#1565C0"/>
  <rect x="112" y="83" width="14" height="10" rx="3" fill="#1565C0"/>
  <!-- Bus lights -->
  <circle cx="76" cy="95" r="4" fill="#FFC107"/>
  <circle cx="124" cy="95" r="4" fill="#FFC107"/>
  <!-- Bus wheels -->
  <circle cx="80" cy="100" r="6" fill="#263238"/>
  <circle cx="120" cy="100" r="6" fill="#263238"/>
  <circle cx="80" cy="100" r="3" fill="#546E7A"/>
  <circle cx="120" cy="100" r="3" fill="#546E7A"/>
</svg>
