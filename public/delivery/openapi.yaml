openapi: 3.1.0
info:
  title: Karta-AD Delivery API
  description: |
    REST API для интеграции интернет-магазинов с курьерской доставкой Karta-AD.

    Авторизация: заголовок `X-API-Key` со значением вашего Delivery API Key (`dk_...`).

    Webhook-подписи: заголовок `X-Karta-Signature: sha256=<HMAC-SHA256(secret, body)>`.
  version: 2.0.0
  contact:
    name: Karta-AD
servers:
  - url: https://eotkmnwneivithfkweds.supabase.co/functions/v1/delivery-api
    description: Production

security:
  - apiKey: []

tags:
  - name: Deliveries
    description: Создание доставок (v1, идемпотентность)
  - name: Orders
    description: Управление заказами доставки
  - name: Status
    description: Статусы и трекинг
  - name: Pricing
    description: Расчёт стоимости

paths:
  /health:
    get:
      tags: [Orders]
      summary: Проверка работоспособности API
      security: []
      responses:
        "200":
          description: Сервис работает

  /v1/deliveries:
    post:
      tags: [Deliveries]
      summary: Создать доставку (v1, идемпотентный)
      operationId: createDeliveryV1
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
          description: Ключ идемпотентности; повтор с тем же ключом вернёт исходный заказ (200 + idempotent_replay)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryV1Request"
      responses:
        "201":
          description: Доставка создана (статус searching_courier)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Идентификатор запроса для поддержки
            X-Sandbox:
              schema:
                type: string
                enum: ["true", "false"]
            X-Idempotent-Replay:
              schema:
                type: string
                enum: ["true"]
              description: Присутствует только при идемпотентном повторе
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDeliveryV1Response"
        "200":
          description: Идемпотентный повтор — заказ уже существует
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDeliveryV1Response"
        "400":
          description: Ошибка валидации (INVALID_JSON, INVALID_BODY, MISSING_COORDINATES)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Неверный или отсутствующий API-ключ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Конфликт идемпотентности (IDEMPOTENCY_CONFLICT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Превышен rate limit
        "502":
          description: Не удалось рассчитать цену (PRICE_CALC_FAILED)

  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Создать заказ доставки
      operationId: createDeliveryOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Ошибка валидации
        "401":
          description: Неверный API-ключ
        "429":
          description: Превышен rate limit
    get:
      tags: [Orders]
      summary: Список заказов магазина
      operationId: listOrders
      responses:
        "200":
          description: Список последних 50 заказов
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"

  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Получить заказ (заказ + позиции + трекинг)
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Полная информация о заказе
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  order:
                    $ref: "#/components/schemas/OrderFull"
        "403":
          description: Заказ не принадлежит этому ключу
        "404":
          description: Заказ не найден

  /api/v1/status/{id}:
    get:
      tags: [Status]
      summary: Получить статус заказа
      operationId: getStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Статус заказа
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  order:
                    type: object
                    properties:
                      status:
                        $ref: "#/components/schemas/DeliveryStatus"

  /api/v1/cancel:
    post:
      tags: [Orders]
      summary: Отменить заказ
      operationId: cancelOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: string
                  format: uuid
                reason:
                  type: string
                  example: Клиент передумал
      responses:
        "200":
          description: Заказ отменён
        "400":
          description: Заказ уже доставлен или отменён

  /api/v1/calculate-price:
    post:
      tags: [Pricing]
      summary: Рассчитать стоимость доставки
      operationId: calculatePrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup_lat, pickup_lng, dropoff_lat, dropoff_lng]
              properties:
                pickup_lat:
                  type: number
                pickup_lng:
                  type: number
                dropoff_lat:
                  type: number
                dropoff_lng:
                  type: number
                weight_kg:
                  type: number
                  default: 0
      responses:
        "200":
          description: Расчёт цены
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  distance_km:
                    type: number
                  price:
                    type: number
                  currency:
                    type: string
                  eta_min:
                    type: integer

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Delivery API Key формата dk_xxxxxxxx

  schemas:
    DeliveryStatus:
      type: string
      enum:
        [
          pending,
          confirmed,
          searching_courier,
          courier_assigned,
          courier_to_pickup,
          arrived_pickup,
          picked_up,
          courier_to_customer,
          arrived_customer,
          delivered,
          cancelled,
          failed,
        ]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
              example: "Missing API key (Authorization: Bearer or x-api-key)"
            request_id:
              type: string
              example: req_a1b2c3d4

    CreateDeliveryV1Request:
      type: object
      required: [pickup_lat, pickup_lng, dropoff_lat, dropoff_lng]
      properties:
        external_order_id:
          type: string
          description: ID заказа в системе магазина (сохраняется в external_id)
        idempotency_key:
          type: string
          description: Альтернатива заголовку Idempotency-Key (тело запроса)
          maxLength: 255
        pickup_lat:
          type: number
          example: 38.545
        pickup_lng:
          type: number
          example: 68.779
        pickup_address:
          type: string
          example: ул. Рудаки, 10
        dropoff_lat:
          type: number
          example: 38.555
        dropoff_lng:
          type: number
          example: 68.789
        dropoff_address:
          type: string
          example: ул. Сафарова, 5
        recipient_name:
          type: string
          example: Иван
        recipient_phone:
          type: string
          example: "+992900000000"
        customer:
          $ref: "#/components/schemas/Customer"
        pickup:
          $ref: "#/components/schemas/AddressPoint"
        dropoff:
          $ref: "#/components/schemas/AddressPoint"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        weight_kg:
          type: number
          description: Общий вес; если не задан — сумма weight_kg по items
          example: 0.5
        item_description:
          type: string
        notes:
          type: string

    DeliverySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        external_order_id:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        public_id:
          type: string
          nullable: true
          example: del_a1b2c3d4e5f6
        price:
          type: number
        total:
          type: number
        distance_km:
          type: number
          nullable: true
        eta_min:
          type: integer
          nullable: true
        order_number:
          type: integer
        tracking:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
        created_at:
          type: string
          format: date-time

    CreateDeliveryV1Response:
      type: object
      properties:
        success:
          type: boolean
          example: true
        delivery:
          $ref: "#/components/schemas/DeliverySummary"
        idempotent_replay:
          type: boolean
          description: true, если заказ уже существовал с этим Idempotency-Key

    Coordinates:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          example: 38.545
        lng:
          type: number
          example: 68.779

    AddressPoint:
      allOf:
        - $ref: "#/components/schemas/Coordinates"
      properties:
        address:
          type: string
          example: Магазин

    OrderItem:
      type: object
      required: [name, qty]
      properties:
        name:
          type: string
          example: Пицца
        qty:
          type: integer
          example: 2
        price:
          type: number
          example: 90
        weight_kg:
          type: number
          example: 0.5

    Customer:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          example: Иван
        phone:
          type: string
          example: "+992900000000"

    CreateOrderRequest:
      type: object
      required: [customer, pickup, dropoff, items]
      properties:
        external_id:
          type: string
          description: ID заказа в системе магазина
        customer:
          $ref: "#/components/schemas/Customer"
        pickup:
          $ref: "#/components/schemas/AddressPoint"
        dropoff:
          $ref: "#/components/schemas/AddressPoint"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        notes:
          type: string
        payment_method:
          type: string
          enum: [cash, card, wallet]
          default: cash

    CreateOrderResponse:
      type: object
      properties:
        success:
          type: boolean
        order:
          type: object
          properties:
            id:
              type: string
              format: uuid
            order_number:
              type: integer
            price:
              type: number
            total:
              type: number
            distance_km:
              type: number
            eta_min:
              type: integer
            status:
              $ref: "#/components/schemas/DeliveryStatus"
            created_at:
              type: string
              format: date-time

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: integer
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        price:
          type: number
        total:
          type: number
        pickup_address:
          type: string
        dropoff_address:
          type: string
        recipient_name:
          type: string
        eta_min:
          type: integer
        payment_status:
          type: string
        created_at:
          type: string
          format: date-time

    OrderFull:
      allOf:
        - $ref: "#/components/schemas/Order"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        tracking:
          type: array
          items:
            type: object
            properties:
              status:
                $ref: "#/components/schemas/DeliveryStatus"
              lat:
                type: number
              lng:
                type: number
              note:
                type: string
              created_at:
                type: string
                format: date-time
